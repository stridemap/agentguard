// ── Bar Chart ─────────────────────────────────────────────────────────────────
function BarChart({data}) {
  const max = Math.max(...data.map(d=>d.bl+d.al));

// ── Pie Chart ─────────────────────────────────────────────────────────────────
function PieChart({data}) {
  let cum=0;
  const r=46,cx=58,cy=58;
  const slices = data.map(d=>{
    const s=cum; cum+=d.pct;
    const a1=(s/100)*2*Math.PI-Math.PI/2, a2=(cum/100)*2*Math.PI-Math.PI/2;
    const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    return {...d, path:`M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${d.pct>50?1:0},1 ${x2},${y2} Z`};
  });
  return (
    <div style={{display:"flex",alignItems:"center",gap:20}}>
      <svg width={116} height={116} viewBox="0 0 116 116">
        {slices.map(s=><path key={s.type} d={s.path} fill={s.color} stroke="#0f172a" strokeWidth={1.5}/>)}
      </svg>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {data.map(d=>(
          <div key={d.type} style={{display:"flex",alignItems:"center",gap:7}}>
            <div style={{width:9,height:9,borderRadius:2,background:d.color,flexShrink:0}}/>
            <span style={{color:"#d1d5db",fontSize:12}}>{d.type}</span>
            <span style={{color:"#4b5563",fontSize:11,marginLeft:4}}>{d.count} ({d.pct}%)</span>
          </div>
        ))}
      </div>
    </div>
  );
}

              <span style={{color:"#e2e8f0",fontSize:13,fontWeight:600}} className="mono">finance-production.yaml</span>

              <div style={{color:"#ef4444",fontSize:13,fontWeight:700,marginBottom:8}}>🛑 Test Result: {result.decision}</div>

// ── Audit Chain ───────────────────────────────────────────────────────────────

        <button style={{background:"rgba(99,102,241,0.11)",border:"1px solid rgba(99,102,241,0.28)",color:"#a78bfa",borderRadius:8,padding:"9px 18px",fontSize:13,fontWeight:600,cursor:"pointer"}}>📥 Export Audit PDF</button>

          <span style={{fontSize:26,flexShrink:0}}>✅</span>
          <div>
            <div style={{color:"#22c55e",fontSize:14,fontWeight:700}}>Chain Integrity Verified — VALID</div>

      <div style={{background:"#111827",border:"1px solid #1f2937",borderRadius:10,padding:18,marginBottom:18}}>

        <div style={{display:"flex",alignItems:"center",gap:0,overflowX:"auto",paddingBottom:8}}>
          {["Genesis","Event N-2","Event N-1","Event N"].map((label,i)=>(

      </div>
    </div>
  );
}

// ── Compliance ────────────────────────────────────────────────────────────────

              ))}
            </div>
          ))}

      </div>
    </div>

}

// ── App Root ──────────────────────────────────────────────────────────────────
function App() {
  const [loggedIn,setLoggedIn] = useState(false);
  const [role,setRole] = useState("");
  const [screen,setScreen] = useState("live");
  const [selectedEvent,setSelectedEvent] = useState(null);

  if(!loggedIn) return <Login onLogin={r=>{setRole(r);setLoggedIn(true);}}/>;

  return (
    <div style={{display:"flex",height:"100vh",overflow:"hidden"}}>
      <Sidebar active={screen} setActive={s=>{setScreen(s);setSelectedEvent(null);}} role={role}/>
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",background:"#060d1a"}}>
        {screen==="live"       && <LiveFeed onEventClick={setSelectedEvent}/>}
        {screen==="violations" && <Violations/>}
        {screen==="health"     && <Health/>}
        {screen==="policy"     && <Policy/>}
        {screen==="audit"      && <AuditChain/>}
        {screen==="compliance" && <Compliance/>}
      </div>
      {selectedEvent && <EventDetail ev={selectedEvent} onClose={()=>setSelectedEvent(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
