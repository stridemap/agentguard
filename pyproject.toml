[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "2.0.0"
description = "Guardrails and policy enforcement for AI agents — the governance layer for LLM-powered agents."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
authors = [
    { name = "Stridemap", email = "hello@stridemap.ai" },
]
keywords = [
    "ai-agents",
    "guardrails",
    "policy-engine",
    "dlp",
    "prompt-injection",
    "langchain",
    "langgraph",
    "security",
    "governance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "langchain-core>=0.2.0",
    "loguru>=0.7",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "pydantic>=2.0",
    "python-jose[cryptography]>=3.3",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9",
    "asyncpg>=0.29",
    "alembic>=1.13",
]
redis = [
    "redis>=5.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.0",
]

[project.scripts]
agentguard = "agentguard.__main__:main"
minigate = "minigate.__main__:main"

[project.urls]
Homepage = "https://stridemap.ai"
Repository = "https://github.com/stridemap/agentguard"
Documentation = "https://github.com/stridemap/agentguard#readme"
Issues = "https://github.com/stridemap/agentguard/issues"
Changelog = "https://github.com/stridemap/agentguard/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["agentguard*", "minigate*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that require LLM calls or heavy I/O (deselect with '-m \"not slow\"')",
]
asyncio_mode = "auto"
