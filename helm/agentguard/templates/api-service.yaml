apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentguard.fullname" . }}-api
  labels:
    {{- include "agentguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "agentguard.name" . }}
    app.kubernetes.io/component: api
