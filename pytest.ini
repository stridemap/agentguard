[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: marks tests that require LLM calls or heavy I/O (deselect with '-m "not slow"')
    integration: marks tests that require external services (database, API)
    performance: marks performance benchmark tests

asyncio_mode = auto

addopts =
    -v
    --strict-markers
    --tb=short

filterwarnings =
    ignore::DeprecationWarning
